name: Record merged message authors

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: message-author-ledger
  cancel-in-progress: false
  queue: max

jobs:
  record:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # This workflow checks out main only and never runs files from the PR.
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Record GitHub's PR author for added message files
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { recordMergedAuthors } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/message-authors.mjs')).href);
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            if (!files.some(file => file.status === 'added' && file.filename.startsWith('messages/') && file.filename.endsWith('.md'))) {
              core.info('此 PR 没有新增留言文件，无需登记作者。');
              return;
            }

            for (let attempt = 1; attempt <= 10; attempt++) {
              const currentFile = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'data/message-authors.json',
                ref: 'main',
              });
              const current = JSON.parse(Buffer.from(currentFile.data.content, 'base64').toString('utf8'));
              const next = recordMergedAuthors(current, {
                merged: pr.merged === true,
                login: pr.user.login,
                number: pr.number,
                mergedAt: pr.merged_at,
                files,
              });
              if (JSON.stringify(current) === JSON.stringify(next)) {
                core.info('留言作者记录已存在，保持不变。');
                break;
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: 'data/message-authors.json',
                  message: `Record message author for PR #${pr.number}`,
                  content: Buffer.from(`${JSON.stringify(next, null, 2)}\n`).toString('base64'),
                  branch: 'main',
                  sha: currentFile.data.sha,
                });
                break;
              } catch (error) {
                if (![409, 422].includes(error.status) || attempt === 10) throw error;
                core.warning(`作者记录发生并发更新，将重试（${attempt}/10）。`);
                await new Promise(resolve => setTimeout(resolve, Math.min(500 * (2 ** (attempt - 1)), 8000) + Math.floor(Math.random() * 250)));
              }
            }
            // Dispatch even when the ledger entry already existed: a previous run
            // may have committed the map but failed before dispatching the Pages build.
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'message-authors-updated',
              client_payload: { pull_number: pr.number },
            });

name: PR 留言校验

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: PR 留言校验
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # pull_request_target 使用目标分支中的可信工作流；只检出 base SHA，PR 内容仅按 Git 对象读取并解析为数据。
      - name: 检出目标分支
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 安装目标分支依赖
        run: npm ci
      - name: 检查 PR 完整变更并校验留言
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/validate-pr.mjs
      - name: 运行自动化测试
        run: npm test
      - name: 检查留言数据
        run: npm run validate
      - name: 检查生产构建
        run: npm run build
      - name: 提供中文失败提示
        if: failure()
        run: echo "::error::留言检查没通过。请按提示只新增一个 messages/ 下的 .md 文件，并检查文件大小和留言内容。"
